<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAMILY 100 – Bahasa Indonesia Kelas 1 | Mengenal Kata Kerja</title>
<style>
:root{
  --bg1:#14063d; --bg2:#3a0ca3; --bg3:#7209b7;
  --gold:#ffd23f; --gold2:#ff9f1c; --pink:#ff3d81; --cyan:#27e1ff;
  --green:#2ee59d; --red:#ff2e4d; --ink:#ffffff; --panel:rgba(255,255,255,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Trebuchet MS","Segoe UI",Verdana,Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 10%,rgba(39,225,255,.25),transparent 40%),
    radial-gradient(circle at 85% 90%,rgba(255,61,129,.25),transparent 40%),
    linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed;
  display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden;
}
/* ===== HEADER ===== */
header{
  display:flex;align-items:center;gap:16px;padding:10px 22px;
  background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,.2));
  border-bottom:4px solid var(--gold);
}
#logo{width:clamp(52px,7vw,84px);height:clamp(52px,7vw,84px);object-fit:contain;border-radius:50%;background:#fff;padding:4px;border:3px solid var(--gold);flex:none}
.titles{flex:1;text-align:center}
.titles h1{
  font-size:clamp(22px,3.6vw,48px);font-weight:900;letter-spacing:2px;
  background:linear-gradient(180deg,#fff7c2,var(--gold) 50%,var(--gold2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.5));
}
.titles h2{font-size:clamp(13px,1.9vw,26px);font-weight:800;color:var(--cyan);letter-spacing:4px;margin-top:2px}
#qIndicator{
  flex:none;background:var(--pink);padding:10px 20px;border-radius:999px;
  font-weight:900;font-size:clamp(14px,1.8vw,24px);box-shadow:0 4px 0 #a3003f;white-space:nowrap;
}
/* ===== MAIN ===== */
main{
  flex:1;display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,3.2fr) minmax(150px,1fr);
  gap:16px;padding:16px 22px;align-items:stretch;
}
.team{
  position:relative;background:var(--panel);border:4px solid rgba(255,255,255,.25);border-radius:22px;
  padding:16px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  transition:all .35s;backdrop-filter:blur(4px);
}
.team .turn-badge{
  position:absolute;top:-16px;left:50%;transform:translateX(-50%) scale(.6);opacity:0;
  background:var(--gold);color:#3b2300;font-weight:900;padding:5px 16px;border-radius:999px;font-size:clamp(12px,1.3vw,18px);
  transition:all .35s;white-space:nowrap;
}
.team.active{
  border-color:var(--gold);background:rgba(255,210,63,.16);
  box-shadow:0 0 0 4px rgba(255,210,63,.3),0 0 40px 8px rgba(255,210,63,.55);
  animation:glow 1.6s ease-in-out infinite;
}
.team.active .turn-badge{opacity:1;transform:translateX(-50%) scale(1)}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(255,210,63,.4),0 0 64px 18px rgba(255,210,63,.8)}}
.team-name{
  font-size:clamp(20px,2.6vw,38px);font-weight:900;text-align:center;outline:none;
  padding:4px 8px;border-radius:10px;max-width:100%;word-break:break-word;
}
.team-name:focus{background:rgba(255,255,255,.15)}
#team0 .team-name{color:var(--cyan)} #team1 .team-name{color:var(--pink)}
.score{
  font-size:clamp(48px,8vw,120px);font-weight:900;line-height:1;color:#fff;
  text-shadow:0 5px 0 rgba(0,0,0,.4),0 0 24px rgba(255,255,255,.35);
  background:rgba(0,0,0,.35);border-radius:18px;padding:6px 18px;min-width:80%;text-align:center;
}
.score.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25);color:var(--gold)}}
.xs{display:flex;gap:6px}
.x{font-size:clamp(24px,3.4vw,50px);filter:grayscale(1) opacity(.25);transition:all .3s}
.x.on{filter:none;animation:xpop .45s}
@keyframes xpop{0%{transform:scale(2.4) rotate(-20deg)}60%{transform:scale(.9)}100%{transform:scale(1)}}
.team-warn{
  display:none;background:var(--red);padding:6px 12px;border-radius:10px;font-weight:900;text-align:center;
  font-size:clamp(12px,1.4vw,20px);animation:blink .7s infinite;
}
.team.out .team-warn{display:block}
@keyframes blink{50%{opacity:.35}}

/* ===== BOARD ===== */
.board{
  background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.25));
  border:5px solid var(--gold);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 0 40px rgba(0,0,0,.5) inset;
}
.cat{align-self:center;background:var(--cyan);color:#00323b;font-weight:900;padding:4px 18px;border-radius:999px;font-size:clamp(12px,1.4vw,19px);letter-spacing:1px}
.question{
  text-align:center;font-weight:900;font-size:clamp(22px,3.3vw,46px);line-height:1.25;
  padding:12px 16px;background:rgba(255,255,255,.1);border-radius:18px;border:3px dashed rgba(255,255,255,.35);
}
.answers{display:flex;flex-direction:column;gap:10px;flex:1;justify-content:space-around}
.card{perspective:1200px;height:clamp(54px,9vh,88px)}
.inner{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.4,.2,.2,1.2);transform-style:preserve-3d}
.card.open .inner{transform:rotateX(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;align-items:center;justify-content:space-between;padding:0 clamp(12px,2vw,28px);
  border-radius:16px;font-weight:900;
}
.front{background:linear-gradient(180deg,#2d7bff,#1236b8);border:4px solid #9fc2ff;box-shadow:0 6px 0 #0b2080}
.front .num{
  width:clamp(36px,5.2vh,56px);height:clamp(36px,5.2vh,56px);border-radius:50%;
  background:var(--gold);color:#3b2300;display:grid;place-items:center;font-size:clamp(20px,3.3vh,36px);
}
.front .hint{font-size:clamp(18px,2.6vw,34px);letter-spacing:6px;opacity:.9}
.front .pts{background:rgba(0,0,0,.35);padding:2px 16px;border-radius:12px;font-size:clamp(18px,2.8vh,34px);color:var(--gold)}
.back{
  transform:rotateX(180deg);
  background:linear-gradient(180deg,#fff7c2,var(--gold) 55%,var(--gold2));border:4px solid #fff;color:#3b2300;
  box-shadow:0 6px 0 #a35a00;
}
.back .atext{flex:1;text-align:center;font-size:clamp(20px,3.5vw,48px);text-transform:uppercase;letter-spacing:1px}
.back .apts{background:#3b2300;color:var(--gold);padding:2px 16px;border-radius:12px;font-size:clamp(18px,2.8vh,34px)}
.back .anum{width:clamp(30px,4.4vh,48px);height:clamp(30px,4.4vh,48px);border-radius:50%;background:#3b2300;color:var(--gold);display:grid;place-items:center;font-size:clamp(16px,2.6vh,28px)}

/* ===== CONTROL PANEL ===== */
.control{
  position:sticky;bottom:0;z-index:20;padding:10px 22px 12px;
  background:linear-gradient(180deg,rgba(10,3,35,.92),rgba(10,3,35,.98));
  border-top:4px solid var(--cyan);
}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row + .row{margin-top:8px}
.control input[type=text]{
  flex:1 1 260px;min-width:0;font-size:20px;padding:12px 16px;border-radius:12px;border:3px solid var(--cyan);
  background:#fff;color:#1b0a4a;font-weight:700;outline:none;
}
.control input[type=text]:focus{box-shadow:0 0 0 4px rgba(39,225,255,.5)}
.control select{font-size:18px;padding:11px 10px;border-radius:12px;border:3px solid var(--gold);background:#fff;color:#1b0a4a;font-weight:800}
button{
  font-family:inherit;font-size:clamp(14px,1.5vw,18px);font-weight:900;border:none;cursor:pointer;color:#fff;
  padding:12px 16px;border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.45);transition:transform .08s,filter .15s;
}
button:hover{filter:brightness(1.15)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.b-check{background:#1fa86f}.b-ok{background:#2a7bff}.b-bad{background:var(--red)}
.b-swap{background:#8a3ffc}.b-reset{background:#e08a00}.b-open{background:#0aa5c2}
.b-next{background:var(--pink)}.b-game{background:#555b6e}.b-logo{background:#444}
.status{font-weight:800;min-height:24px;font-size:16px;color:var(--gold);flex:1 1 200px}
.hintcode{font-size:13px;opacity:.75}

/* ===== OVERLAYS ===== */
#bigX{
  position:fixed;inset:0;display:none;place-items:center;pointer-events:none;z-index:60;
}
#bigX span{font-size:min(55vw,55vh);filter:drop-shadow(0 0 40px rgba(255,0,40,.9));animation:xshow 1.1s forwards}
@keyframes xshow{0%{transform:scale(0) rotate(-25deg);opacity:0}25%{transform:scale(1.15) rotate(5deg);opacity:1}40%{transform:scale(.95)}70%{opacity:1}100%{transform:scale(1);opacity:0}}
.floatpts{
  position:absolute;left:50%;top:10%;transform:translateX(-50%);z-index:30;pointer-events:none;
  font-size:clamp(24px,3.6vw,52px);font-weight:900;color:var(--gold);white-space:nowrap;
  text-shadow:0 3px 0 #7a4a00,0 0 20px rgba(255,210,63,.9);animation:floatUp 1.8s ease-out forwards;
}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,40px) scale(.5)}20%{opacity:1;transform:translate(-50%,0) scale(1.2)}100%{opacity:0;transform:translate(-50%,-140px) scale(1)}}
#toast{
  position:fixed;top:92px;left:50%;transform:translate(-50%,-30px);z-index:70;background:#fff;color:#1b0a4a;
  font-weight:900;padding:10px 24px;border-radius:999px;opacity:0;transition:all .3s;pointer-events:none;font-size:clamp(14px,1.8vw,22px);
  box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:92vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#banner{
  display:none;text-align:center;background:var(--red);font-weight:900;padding:8px;font-size:clamp(16px,2.2vw,30px);
  animation:blink .8s infinite;
}
/* modal */
#winModal{
  position:fixed;inset:0;z-index:100;display:none;place-items:center;background:rgba(10,3,35,.92);
}
#winModal.show{display:grid}
#fw{position:absolute;inset:0;width:100%;height:100%}
.winbox{
  position:relative;z-index:2;width:min(92vw,760px);text-align:center;padding:28px 24px;border-radius:28px;
  background:linear-gradient(160deg,#3a0ca3,#7209b7);border:6px solid var(--gold);
  box-shadow:0 0 60px rgba(255,210,63,.7);animation:pop .7s cubic-bezier(.2,1.4,.4,1);
}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.winbox h3{font-size:clamp(18px,2.6vw,30px);color:var(--cyan);letter-spacing:3px}
.winner{
  font-size:clamp(32px,6vw,72px);font-weight:900;margin:10px 0;
  background:linear-gradient(180deg,#fff7c2,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:pulse 1s infinite alternate;
}
@keyframes pulse{to{transform:scale(1.07)}}
.final{display:flex;justify-content:center;gap:16px;align-items:stretch;margin:14px 0}
.fbox{flex:1;background:rgba(0,0,0,.35);border-radius:18px;padding:12px}
.fbox .n{font-weight:900;font-size:clamp(16px,2.2vw,26px)}
.fbox .s{font-weight:900;font-size:clamp(36px,6vw,76px);line-height:1.1}
.vs{align-self:center;font-weight:900;font-size:clamp(20px,3vw,36px);color:var(--gold)}
.total{font-weight:800;font-size:clamp(16px,2vw,24px);margin-bottom:14px}

/* ===== RESPONSIVE ===== */
@media (max-width:900px){
  main{grid-template-columns:1fr 1fr;}
  .board{grid-column:1 / -1;order:-1}
  header{flex-wrap:wrap;justify-content:center}
}
</style>
</head>
<body>

<header>
  <img id="logo" alt="Logo">
  <div class="titles">
    <h1>FAMILY 100 – BAHASA KELAS 1</h1>
    <h2>MENGENAL KATA KERJA</h2>
  </div>
  <div id="qIndicator">Soal 1 dari 10</div>
</header>

<div id="banner"></div>

<main>
  <section class="team" id="team0">
    <div class="turn-badge">▶ GILIRAN</div>
    <h2 class="team-name" contenteditable="true" spellcheck="false">TIM 1</h2>
    <div class="score" id="score0">0</div>
    <div class="xs" id="xs0"><span class="x">❌</span><span class="x">❌</span><span class="x">❌</span></div>
    <div class="team-warn">⚠️ GILIRAN HABIS!</div>
  </section>

  <section class="board">
    <div class="cat" id="cat">KATEGORI</div>
    <div class="question" id="question">Pertanyaan</div>
    <div class="answers" id="answers"></div>
  </section>

  <section class="team" id="team1">
    <div class="turn-badge">▶ GILIRAN</div>
    <h2 class="team-name" contenteditable="true" spellcheck="false">TIM 2</h2>
    <div class="score" id="score1">0</div>
    <div class="xs" id="xs1"><span class="x">❌</span><span class="x">❌</span><span class="x">❌</span></div>
    <div class="team-warn">⚠️ GILIRAN HABIS!</div>
  </section>
</main>

<div class="control">
  <div class="row">
    <input type="text" id="answerInput" placeholder="Ketik jawaban peserta lalu tekan Enter…" autocomplete="off" spellcheck="false">
    <button class="b-check" id="btnCheck">✔ Cek Jawaban</button>
    <select id="manualSel" title="Pilih kode jawaban 1–5">
      <option value="">Kode 1–5</option>
      <option value="0">1</option><option value="1">2</option><option value="2">3</option>
      <option value="3">4</option><option value="4">5</option>
    </select>
    <button class="b-ok" id="btnOk">✅ Benar</button>
    <button class="b-bad" id="btnBad">❌ Salah</button>
  </div>
  <div class="row">
    <button class="b-swap" id="btnSwap">🔄 Ganti Tim</button>
    <button class="b-reset" id="btnResetX">↩ Reset ❌</button>
    <button class="b-open" id="btnOpenAll">👁 Buka Semua Jawaban</button>
    <button class="b-next" id="btnNext">➡ Soal Berikutnya</button>
    <button class="b-game" id="btnGame">⟲ Reset Game</button>
    <button class="b-logo" id="btnLogo">🖼 Ganti Logo</button>
    <input type="file" id="logoFile" accept="image/*" hidden>
    <span class="status" id="status"></span>
  </div>
</div>

<div id="bigX"><span>❌</span></div>
<div id="toast"></div>

<div id="winModal">
  <canvas id="fw"></canvas>
  <div class="winbox">
    <h3>🏆 HASIL AKHIR 🏆</h3>
    <div class="winner" id="winnerText">TIM 1 MENANG!</div>
    <div class="final">
      <div class="fbox"><div class="n" id="fn0" style="color:var(--cyan)">TIM 1</div><div class="s" id="fs0">0</div></div>
      <div class="vs">VS</div>
      <div class="fbox"><div class="n" id="fn1" style="color:var(--pink)">TIM 2</div><div class="s" id="fs1">0</div></div>
    </div>
    <div class="total" id="totalText">Total Poin Keseluruhan: 0</div>
    <div class="row" style="justify-content:center">
      <button class="b-ok" id="btnPlayAgain">🔁 Main Lagi</button>
      <button class="b-game" id="btnCloseModal">Tutup</button>
    </div>
  </div>
</div>

<script>
/* =====================================================
   LOGO — ganti nilai LOGO_SRC dengan data URI / nama file
   gambar logo Anda, atau pakai tombol "Ganti Logo".
   ===================================================== */
const DEFAULT_LOGO = 'data:image/svg+xml;utf8,' + encodeURIComponent(
 '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
 '<circle cx="50" cy="50" r="46" fill="#3a0ca3"/><circle cx="50" cy="50" r="40" fill="none" stroke="#ffd23f" stroke-width="4"/>' +
 '<path d="M24 36 Q38 30 50 38 Q62 30 76 36 V68 Q62 62 50 70 Q38 62 24 68 Z" fill="#fff" stroke="#ffd23f" stroke-width="3" stroke-linejoin="round"/>' +
 '<path d="M50 38 V70" stroke="#ffd23f" stroke-width="3"/>' +
 '<polygon points="50,12 54,22 65,22 56,28 60,38 50,32 40,38 44,28 35,22 46,22" fill="#ffd23f"/></svg>');
let LOGO_SRC = DEFAULT_LOGO;
try { const saved = localStorage.getItem('f100_logo'); if (saved) LOGO_SRC = saved; } catch(e){}
document.getElementById('logo').src = LOGO_SRC;

/* =====================================================
   BANK SOAL — 10 soal, 5 jawaban (100/80/60/40/20)
   ===================================================== */
const POINTS = [100,80,60,40,20];
const QUESTIONS = [
 { cat:"Kegiatan di Pagi Hari", q:"Sebutkan kegiatan yang kamu lakukan di pagi hari!",
   answers:[
    {text:"Bangun tidur", keys:["bangun tidur","bangun","terbangun","membuka mata"]},
    {text:"Mandi", keys:["mandi","mandi pagi","membersihkan badan"]},
    {text:"Sarapan", keys:["sarapan","makan pagi","makan"]},
    {text:"Menggosok gigi", keys:["menggosok gigi","gosok gigi","sikat gigi","menyikat gigi","menyikat","gigi"]},
    {text:"Pergi ke Sekolah", keys:["pergi","pergi sekolah","sekolah","berangkat sekolah","pergi"]}
   ]},
 { cat:"Kegiatan di Sekolah", q:"Sebutkan kegiatan yang dilakukan di sekolah!",
   answers:[
    {text:"Belajar", keys:["belajar","belajar di kelas","menuntut ilmu"]},
    {text:"Menulis", keys:["menulis","tulis","nulis"]},
    {text:"Membaca", keys:["membaca","baca","baca buku","membaca buku"]},
    {text:"Bermain", keys:["bermain","main","bermain bersama","bermain di halaman"]},
    {text:"Menggambar", keys:["gambar","lukis","mewarnai","menggambar","mewarnai gambar"]}
   ]},
 { cat:"Kegiatan di Rumah", q:"Sebutkan kegiatan yang dilakukan di rumah!",
   answers:[
    {text:"Makan", keys:["makan","makan bersama","makan siang","makan malam"]},
    {text:"Tidur", keys:["tidur","tidur siang","istirahat","tiduran"]},
    {text:"Menonton TV", keys:["menonton tv","nonton tv","menonton televisi","nonton televisi","nonton","menonton","melihat tv","lihat tv","tv","televisi"]},
    {text:"Bermain Game", keys:["game","main game","bermain","roblox","minecraft","mobile legends","pubg","free fire"]},
    {text:"Mengerjakan PR", keys:["mengerjakan pr","mengerjakan pekerjaan rumah","mengerjakan tugas","mengerjakan pe er","mengerjakan peer","mengerjakan","pr","peer","pekerjaan rumah"]}
   ]},
 { cat:"Kegiatan Saat Berolahraga", q:"Sebutkan kegiatan saat berolahraga!",
   answers:[
    {text:"Berlari", keys:["berlari","lari","lari pagi","jogging","joging"]},
    {text:"Senam", keys:["senam","bersenam","senam pagi"]},
    {text:"Berenang", keys:["berenang","renang"]},
    {text:"Melempar bola", keys:["melempar bola","lempar bola","melempar","bermain bola","main bola","sepak bola","sepakbola"]},
    {text:"Bermain bulu tangkis", keys:["bermain bulu tangkis","main bulu tangkis","bulu tangkis","bulutangkis","badminton"]}
   ]},
 { cat:"Kegiatan yang Menggunakan Kaki", q:"Sebutkan kegiatan yang menggunakan kaki!",
   answers:[
    {text:"Berjalan", keys:["berjalan","jalan","berjalan kaki","jalan kaki","melangkah"]},
    {text:"Berlari", keys:["berlari","lari","lari pagi"]},
    {text:"Menendang", keys:["menendang","tendang","menendang bola","tendang bola"]},
    {text:"Melompat", keys:["melompat","lompat","meloncat","loncat"]},
    {text:"Bersepeda", keys:["bersepeda","sepeda","naik sepeda","mengayuh sepeda","gowes"]}
   ]},
 { cat:"Kegiatan Membantu Ibu", q:"Sebutkan kegiatan membantu ibu di rumah!",
   answers:[
    {text:"Memasak", keys:["memasak","masak","membantu memasak","bantu masak","menggoreng"]},
    {text:"Mencuci piring", keys:["mencuci piring","cuci piring","membersihkan piring"]},
    {text:"Menyapu", keys:["menyapu","sapu","menyapu lantai","menyapu halaman","menyapu rumah"]},
    {text:"Melipat baju", keys:["melipat baju","lipat baju","melipat pakaian","lipat pakaian","melipat","merapikan baju"]},
    {text:"Menyiram tanaman", keys:["menyiram tanaman","siram tanaman","menyiram bunga","siram bunga","menyiram pohon","menyiram"]}
   ]},
 { cat:"Kegiatan Belajar", q:"Sebutkan kegiatan saat belajar!",
   answers:[
    {text:"Membaca", keys:["membaca","baca","baca buku","membaca buku"]},
    {text:"Menulis", keys:["menulis","tulis","nulis"]},
    {text:"Menggambar", keys:["menggambar","gambar","mewarnai","warna","mewarnai gambar"]},
    {text:"Berhitung", keys:["berhitung","hitung","menghitung","menjumlah","menjumlahkan"]},

 { cat:"Hobi", q:"Sebutkan kegiatan yang menjadi hobi anak-anak!",

/* =====================================================
   STATE
   ===================================================== */
const $ = id => document.getElementById(id);
let qi = 0, scores = [0,0], active = 0, wrongs = [0,0], opened = [false,false,false,false,false];

/* =====================================================
   AUDIO (Web Audio API — tanpa file eksternal)
   ===================================================== */
let actx = null;
function audio(){
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
  }catch(e){}
  return actx;
}
function tone(freq, start, dur, type='sine', gain=.25, slideTo=null){
  const c = audio(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, c.currentTime + start);
  if(slideTo) o.frequency.linearRampToValueAtTime(slideTo, c.currentTime + start + dur);
  g.gain.setValueAtTime(0.0001, c.currentTime + start);
  g.gain.exponentialRampToValueAtTime(gain, c.currentTime + start + .02);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + .05);
}
function playCorrect(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.09,.35,'triangle',.28)); tone(1318.5,.38,.5,'sine',.18); }
function playWrong(){ tone(130,0,.55,'sawtooth',.3,90); tone(98,0,.55,'square',.18,70); }
function playFlip(){ tone(700,0,.08,'triangle',.15); tone(520,.07,.1,'triangle',.12); }
function playDup(){ tone(440,0,.12,'sine',.2); tone(440,.18,.12,'sine',.2); }
function playFanfare(){
  const seq=[[523.25,0,.18],[523.25,.2,.18],[523.25,.4,.18],[659.25,.6,.35],[587.33,.98,.18],[659.25,1.18,.18],[783.99,1.4,.7],[1046.5,2.1,.9]];
  seq.forEach(([f,t,d])=>{tone(f,t,d,'square',.16); tone(f/2,t,d,'triangle',.18);});
}

/* =====================================================
   FUZZY MATCHING
   ===================================================== */
function norm(s){ return s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    prev=cur;
  }
  return prev[n];
}
function keyMatch(input,key){
  const a=norm(input).replace(/ /g,''), b=norm(key).replace(/ /g,'');
  if(!a||!b) return false;
  if(a===b) return true;
  if(b.length>=4 && a.includes(b)) return true;                       // "dia sedang mandi pagi"
  if(a.length>=5 && b.includes(a) && a.length>=b.length*.6) return true; // ketikan sebagian
  const tol = b.length<=4 ? 0 : (b.length<=8 ? 1 : 2);                // typo kecil
  return lev(a,b)<=tol;
}
function findAnswer(input){
  const ans = QUESTIONS[qi].answers;
  // utamakan jawaban yang belum terbuka
  for(const wantOpen of [false,true]){
    for(let i=0;i<ans.length;i++){
      if(opened[i]!==wantOpen) continue;
      if(ans[i].keys.some(k=>keyMatch(input,k))) return i;
    }
  }
  return -1;
}

/* =====================================================
   RENDER
   ===================================================== */
function renderQuestion(){
  const Q = QUESTIONS[qi];
  $('qIndicator').textContent = `Soal ${qi+1} dari ${QUESTIONS.length}`;
  $('cat').textContent = Q.cat.toUpperCase();
  $('question').textContent = Q.q;
  const box = $('answers'); box.innerHTML = '';
  Q.answers.forEach((a,i)=>{
    const d = document.createElement('div'); d.className='card'; d.id='card'+i;
    d.innerHTML =
      `<div class="inner">
         <div class="face front"><div class="num">${i+1}</div><div class="hint">• • • • •</div><div class="pts">${POINTS[i]}</div></div>
         <div class="face back"><div class="anum">${i+1}</div><div class="atext"></div><div class="apts">${POINTS[i]}</div></div>
       </div>`;
    d.querySelector('.atext').textContent = a.text;
    box.appendChild(d);
  });
  opened = [false,false,false,false,false];
  wrongs = [0,0];
  renderTeams();
  $('btnNext').textContent = (qi === QUESTIONS.length-1) ? '🏆 Lihat Hasil' : '➡ Soal Berikutnya';
  $('answerInput').value=''; $('status').textContent='';
}
function renderTeams(){
  [0,1].forEach(t=>{
    const el=$('team'+t);
    el.classList.toggle('active', active===t);
    el.classList.toggle('out', wrongs[t]>=3);
    [...$('xs'+t).children].forEach((x,i)=>x.classList.toggle('on', i<wrongs[t]));
  });
  updateBanner();
}
function updateBanner(){
  const b=$('banner');
  if(wrongs[active]>=3){
    b.style.display='block';
    b.textContent=`⚠️ GILIRAN ${teamName(active)} HABIS! Tekan "Ganti Tim"`;
  } else b.style.display='none';
}
function teamName(t){ return ($('team'+t).querySelector('.team-name').textContent.trim() || ('TIM '+(t+1))).toUpperCase(); }
function setScoreText(){
  [0,1].forEach(t=>{ $('score'+t).textContent = scores[t]; });
}
function bumpScore(t){
  const s=$('score'+t); s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump');
}

/* =====================================================
   AKSI
   ===================================================== */
let toastTimer;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}
function floatPoints(t, pts){
  const f=document.createElement('div'); f.className='floatpts'; f.textContent=`+${pts} POIN!`;
  $('team'+t).appendChild(f); setTimeout(()=>f.remove(),1900);
}
function openAnswer(i, award){
  if(opened[i]) return;
  opened[i]=true;
  $('card'+i).classList.add('open');
  if(award){
    scores[active]+=POINTS[i]; setScoreText(); bumpScore(active);
    floatPoints(active, POINTS[i]); playCorrect();
    $('status').textContent='✔ Benar! Jawaban terbuka.';
    if(opened.every(Boolean)) setTimeout(()=>toast('🎉 Semua jawaban sudah terbuka!'),700);
  }
}
function checkAnswer(){
  audio();
  const v=$('answerInput').value.trim();
  if(!v){ toast('Ketik jawaban peserta dulu ya'); return; }
  const idx=findAnswer(v);
  if(idx===-1){ doWrong(); }
  else if(opened[idx]){ playDup(); toast('Jawaban itu sudah terbuka (tidak ada poin ganda)'); $('status').textContent='Sudah terbuka — tidak ada poin ganda.'; }
  else { openAnswer(idx,true); }
  $('answerInput').value=''; $('answerInput').focus();
}
function manualCorrect(){
  audio();
  const v=$('manualSel').value;
  if(v===''){ toast('Pilih kode jawaban 1–5 dulu'); return; }
  const i=+v;
  if(opened[i]){ playDup(); toast(`Kotak nomor ${i+1} sudah terbuka (tidak ada poin ganda)`); return; }
  openAnswer(i,true);
  $('manualSel').value='';
}
function doWrong(){
  audio();
  if(wrongs[active]>=3){ toast(`TIM ${active+1} sudah 3 ❌ — tekan "Ganti Tim"`); return; }
  wrongs[active]++; renderTeams();
  const bx=$('bigX'); bx.style.display='grid';
  const sp=bx.firstElementChild; sp.style.animation='none'; void sp.offsetWidth; sp.style.animation='';
  setTimeout(()=>bx.style.display='none',1100);
  playWrong();
  $('status').textContent='✖ Jawaban salah / tidak ada di survei.';
  if(wrongs[active]>=3) setTimeout(()=>toast(`⚠️ Giliran ${teamName(active)} habis!`),600);
}
function swapTeam(){ active=1-active; renderTeams(); playFlip(); }
function resetX(){ wrongs=[0,0]; renderTeams(); toast('Tanda ❌ direset'); }
function openAll(){
  let n=0;
  opened.forEach((o,i)=>{ if(!o){ setTimeout(()=>{openAnswer(i,false);playFlip();}, n*350); n++; } });
  if(!n) toast('Semua jawaban sudah terbuka');
}
function nextQuestion(){
  audio();
  if(qi < QUESTIONS.length-1){ qi++; renderQuestion(); playFlip(); }
  else showWin();
}
function resetGame(){
  if(!confirm('Ulangi game dari awal? Semua skor akan menjadi 0.')) return;
  fullReset();
}
function fullReset(){
  qi=0; scores=[0,0]; active=0; setScoreText(); renderQuestion(); closeModal();
}

/* =====================================================
   LAYAR KEMENANGAN + KEMBANG API
   ===================================================== */
const fc=$('fw'), fx=fc.getContext('2d'); let parts=[], fwOn=false, fwTimer=null;
function fwResize(){ fc.width=innerWidth; fc.height=innerHeight; }
window.addEventListener('resize',fwResize);
function burst(x,y){
  const hue=Math.random()*360;
  for(let i=0;i<80;i++){
    const a=Math.random()*Math.PI*2, s=Math.random()*7+1.5;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,hue:hue+Math.random()*40});
  }
}
function fwLoop(){
  if(!fwOn) return;
  fx.globalCompositeOperation='source-over';
  fx.fillStyle='rgba(15,5,50,.22)'; fx.fillRect(0,0,fc.width,fc.height);
  fx.globalCompositeOperation='lighter';
  parts.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=.06; p.vx*=.99; p.life-=.011;
    fx.fillStyle=`hsla(${p.hue},100%,60%,${Math.max(p.life,0)})`;
    fx.beginPath(); fx.arc(p.x,p.y,2.6,0,6.283); fx.fill();
  });
  parts=parts.filter(p=>p.life>0);
  requestAnimationFrame(fwLoop);
}
function startFireworks(){
  fwResize(); fwOn=true; parts=[]; fwLoop();
  burst(fc.width*.5,fc.height*.35);
  fwTimer=setInterval(()=>burst(Math.random()*fc.width, Math.random()*fc.height*.6+30),450);
}
function stopFireworks(){ fwOn=false; clearInterval(fwTimer); }
function showWin(){
  const [a,b]=scores;
  $('fn0').textContent=teamName(0); $('fn1').textContent=teamName(1);
  $('fs0').textContent=a; $('fs1').textContent=b;
  $('totalText').textContent=`Total Poin Keseluruhan: ${a+b}`;
  $('winnerText').textContent = a===b ? 'HASIL SERI! 🤝' : `${teamName(a>b?0:1)} MENANG! 🎉`;
  $('winModal').classList.add('show');
  playFanfare(); startFireworks();
}
function closeModal(){ $('winModal').classList.remove('show'); stopFireworks(); }

   EVENT

$('btnCheck').onclick=checkAnswer;
$('btnOk').onclick=manualCorrect;
$('btnBad').onclick=doWrong;
$('btnSwap').onclick=swapTeam;
$('btnResetX').onclick=resetX;
$('btnOpenAll').onclick=openAll;
$('btnNext').onclick=nextQuestion;
$('btnGame').onclick=resetGame;
$('btnPlayAgain').onclick=fullReset;
$('btnCloseModal').onclick=closeModal;
$('answerInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); checkAnswer(); }});
$('btnLogo').onclick=()=>$('logoFile').click();
$('logoFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ $('logo').src=r.result; try{localStorage.setItem('f100_logo',r.result);}catch(err){} };
  r.readAsDataURL(f);
};
document.querySelectorAll('.team-name').forEach(el=>{
  el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); el.blur(); }});
  el.addEventListener('blur',()=>updateBanner());
});
document.addEventListener('pointerdown',audio,{once:true});

/* MULAI */
setScoreText();
renderQuestion();
</script>
